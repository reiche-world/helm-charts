{{- $pullPolicy := ternary "Always" "IfNotPresent" (eq "latest" .Values.image.tag) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-service.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "web-service.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "web-service.fullname" . }}
      annotations:
        redeployTrigger: {{ ternary (now | date "2006-01-02T15:04:05") "none" (eq "latest" .Values.image.tag) }}
    spec:
      enableServiceLinks: false
      containers:
        - name: {{ include "web-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ $pullPolicy }}
          {{ with .Values.resources }}
          resources:
            {{ toYaml . | nindent 12}}
          {{ end }}
          {{ if or .Values.service.enabled }}
          ports:
            - containerPort: {{ .Values.service.containerPort }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.service.containerPort }}
            failureThreshold: 60
            periodSeconds: 1
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.containerPort }}
            timeoutSeconds: 3
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          {{ end }}
          envFrom:
            {{- range .Values.secretRefs }}
            - secretRef:
                name: {{ .name }}
            {{- end }}
            - configMapRef:
                name: {{ include "web-service.fullname" . }}
            {{- range .Values.configMapRefs }}
            - configMapRef:
                name: {{ .name }}
            {{- end }}
          volumeMounts:
            {{- range .Values.configMapMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- range .Values.configMapMounts }}
        - name: {{ .name }}
          configMap:
            name: {{ .name }}
        {{- end }}
