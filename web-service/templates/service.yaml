{{ if or .Values.service.enabled .Values.ingress.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "web-service.fullname" . }}
spec:
  selector:
    app: {{ include "web-service.fullname" . }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.containerPort }}
      name: web
    {{- if gt (len .Values.service.additionalPorts) 0 }}
    {{- toYaml .Values.service.additionalPorts | nindent 4 }}
    {{- end }}
  type: ClusterIP
{{ end }}
